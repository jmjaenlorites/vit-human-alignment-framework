[project]
name = "vit-human-alignment-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.10.4",
    "jax>=0.8.1",
    "matplotlib>=3.10.8",
    "natsort>=8.4.0",
    "opencv-python>=4.13.0.90",
    "pandas>=2.3.3",
    "scipy>=1.12.0",
    "timm>=1.0.22",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "wget>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
# `jax[cuda12]` solo tiene wheels para Linux x86_64. Activarlo en el server con
# `uv sync --extra cuda`. macOS sigue cayendo a la wheel CPU sin pelearse.
cuda = [
    "jax[cuda12]>=0.8.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
